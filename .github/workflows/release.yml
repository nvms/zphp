name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux-x86_64
          - os: ubuntu-24.04-arm
            name: linux-aarch64
          # pinned to 15: macos-latest = macOS 26 whose SDK zig 0.15.1 can't link
          - os: macos-15
            name: macos-aarch64
          - os: ubuntu-24.04
            name: linux-x86_64-musl
            alpine: x86_64
            apk_sha: 34bb1a96f0258982377a289392d4ea9f3f4b767a4bb5806b1b87179b79ad8a1c
          - os: ubuntu-24.04-arm
            name: linux-aarch64-musl
            alpine: aarch64
            apk_sha: e471d35aa221d031abe9b6288aede12a8e9f1a398954e5a2e1d1bce1727b4ef4
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: mlugg/setup-zig@v2
        if: ${{ !matrix.alpine }}
        with:
          version: 0.15.1

      - name: install system libs (ubuntu glibc)
        if: runner.os == 'Linux' && !matrix.alpine
        run: sudo apt-get update && sudo apt-get install -y libpcre2-dev libsqlite3-dev zlib1g-dev libmysqlclient-dev libpq-dev libssl-dev libnghttp2-dev libcurl4-openssl-dev libxml2-dev libicu-dev libgmp-dev libgd-dev libsodium-dev libldap2-dev

      - name: install system libs (macos)
        if: runner.os == 'macOS'
        run: brew install mysql-client libpq openssl@3 nghttp2 curl libxml2 icu4c gmp gd libsodium openldap

      - name: setup alpine (musl)
        if: matrix.alpine
        uses: jirutka/setup-alpine@v1
        with:
          arch: ${{ matrix.alpine }}
          # pinned: a new alpine release changes library packaging under our feet
          branch: v3.22
          apk-tools-url: https://gitlab.alpinelinux.org/api/v4/projects/5/packages/generic/v2.14.10/${{ matrix.alpine }}/apk.static#!sha256!${{ matrix.apk_sha }}
          packages: >
            build-base linux-headers curl xz cmake m4 python3
            pcre2-dev pcre2-static sqlite-dev sqlite-static zlib-dev zlib-static
            mariadb-connector-c-dev mariadb-static libpq-dev
            openssl-dev openssl-libs-static
            curl-dev curl-static c-ares-dev
            zstd-static libidn2-dev libidn2-static libunistring-dev libunistring-static
            libxml2-dev libxml2-static xz-static
            icu-dev icu-static icu-libs
            libpng-dev libpng-static libjpeg-turbo-dev libjpeg-turbo-static freetype-dev freetype-static bzip2-static
            libsodium-dev libsodium-static

      - name: build static dependencies (alpine)
        if: matrix.alpine
        shell: alpine.sh --root {0}
        run: sh .github/scripts/musl_static_deps.sh

      - name: install zig (alpine)
        if: matrix.alpine
        shell: alpine.sh --root {0}
        run: |
          cd /tmp
          curl -sSL https://ziglang.org/download/0.15.1/zig-${{ matrix.alpine }}-linux-0.15.1.tar.xz | tar -xJ
          mv zig-${{ matrix.alpine }}-linux-0.15.1 /opt/zig
          ln -s /opt/zig/zig /usr/local/bin/zig
          zig version

      - name: build (glibc/macos)
        if: ${{ !matrix.alpine }}
        run: zig build -Doptimize=ReleaseFast
        env:
          PKG_CONFIG_PATH: ${{ runner.os == 'macOS' && '/opt/homebrew/opt/mysql-client/lib/pkgconfig:/opt/homebrew/opt/libpq/lib/pkgconfig:/opt/homebrew/opt/curl/lib/pkgconfig:/opt/homebrew/opt/icu4c/lib/pkgconfig:/opt/homebrew/opt/gmp/lib/pkgconfig:/opt/homebrew/opt/gd/lib/pkgconfig:/opt/homebrew/opt/libsodium/lib/pkgconfig:/opt/homebrew/opt/openldap/lib/pkgconfig:/usr/local/opt/mysql-client/lib/pkgconfig:/usr/local/opt/libpq/lib/pkgconfig:/usr/local/opt/icu4c/lib/pkgconfig:/usr/local/opt/gmp/lib/pkgconfig:/usr/local/opt/gd/lib/pkgconfig:/usr/local/opt/libsodium/lib/pkgconfig:/usr/local/opt/openldap/lib/pkgconfig' || '' }}

      - name: build (musl)
        if: matrix.alpine
        shell: alpine.sh {0}
        env:
          PKG_CONFIG_PATH: /usr/local/lib/pkgconfig
        run: zig build -Doptimize=ReleaseFast -Dcpu=baseline

      - name: smoke test (musl)
        if: matrix.alpine
        shell: alpine.sh {0}
        run: |
          cat > /tmp/smoke.php <<'PHP'
          <?php
          echo "musl ok: " . PHP_VERSION . "\n";
          echo (preg_match('/^ok$/', 'ok') ? 'pcre ok' : 'pcre fail') . "\n";
          echo (fileperms('/etc/hostname') > 0 ? 'stat ok' : 'stat fail') . "\n";
          PHP
          ./zig-out/bin/zphp run /tmp/smoke.php

      - name: package
        run: |
          cp zig-out/bin/zphp zphp-${{ matrix.name }}
          chmod +x zphp-${{ matrix.name }}

      # the packaged file is what ships, so that is what gets executed here,
      # not the zig-out build it was copied from
      - name: smoke test packaged binary (glibc/macos)
        if: ${{ !matrix.alpine }}
        run: |
          ./zphp-${{ matrix.name }} version
          ./zphp-${{ matrix.name }} run .github/scripts/release_smoke.php

      # a musl artifact must be static: it runs on the ubuntu host here, outside
      # alpine, with no musl loader available
      - name: smoke test packaged binary (musl)
        if: matrix.alpine
        run: |
          file zphp-${{ matrix.name }}
          file zphp-${{ matrix.name }} | grep -q "statically linked"
          ./zphp-${{ matrix.name }} version
          ./zphp-${{ matrix.name }} run .github/scripts/release_smoke.php

      # which native libraries the binary loads at runtime, with the versions
      # the build host had. glibc and macos builds link them dynamically and
      # need the same sonames on the target machine; musl builds are static
      - name: record linked libraries (musl)
        if: matrix.alpine
        shell: alpine.sh {0}
        run: |
          {
            echo "zphp-${{ matrix.name }} built on ${{ matrix.os }} in alpine v3.22 with zig 0.15.1"
            echo "statically linked; no runtime library dependencies. archives linked in:"
            echo
            echo "built from source by .github/scripts/musl_static_deps.sh:"
            cat /usr/local/share/zphp-static-deps.txt
            echo
            echo "alpine packages:"
            apk info -v 2>/dev/null | grep -E '^(musl|pcre2|sqlite|zlib|mariadb|libpq|openssl|curl|c-ares|zstd|libidn2|libunistring|libxml2|xz|icu|libpng|libjpeg|freetype|bzip2|libsodium|brotli|nghttp2|libpsl)' || true
          } > zphp-${{ matrix.name }}.libs.txt
          cat zphp-${{ matrix.name }}.libs.txt

      - name: record linked libraries
        if: ${{ !matrix.alpine }}
        run: |
          {
            echo "zphp-${{ matrix.name }} built on ${{ matrix.os }} with zig 0.15.1"
            echo
            if [ "${{ runner.os }}" = "macOS" ]; then
              otool -L zphp-${{ matrix.name }}
              echo
              brew list --versions mysql-client libpq openssl@3 nghttp2 curl libxml2 icu4c gmp gd libsodium openldap pcre2 sqlite 2>/dev/null || true
            elif [ -n "${{ matrix.alpine }}" ]; then
              echo "musl build: dynamically linked against musl and the alpine ${{ matrix.alpine }} packages below"
              file zphp-${{ matrix.name }} || true
            else
              ldd zphp-${{ matrix.name }}
              echo
              dpkg-query -W libpcre2-8-0 libsqlite3-0 zlib1g libmysqlclient21 libpq5 libssl3t64 libnghttp2-14 libcurl4t64 libxml2 libicu74 libgmp10 libgd3 libsodium23 libldap2 2>/dev/null || dpkg-query -W 'libpcre2*' 'libsqlite3*' 'zlib1g' 'libmysqlclient*' 'libpq5' 'libssl3*' 'libnghttp2*' 'libcurl4*' 'libxml2' 'libicu*' 'libgmp10' 'libgd3' 'libsodium*' 'libldap*' 2>/dev/null || true
            fi
          } > zphp-${{ matrix.name }}.libs.txt
          cat zphp-${{ matrix.name }}.libs.txt

      - uses: actions/attest-build-provenance@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          subject-path: zphp-${{ matrix.name }}

      - uses: actions/upload-artifact@v4
        with:
          name: zphp-${{ matrix.name }}
          path: |
            zphp-${{ matrix.name }}
            zphp-${{ matrix.name }}.libs.txt

  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v6
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          path-type: inherit
          update: true
          install: >-
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-pcre2
            mingw-w64-x86_64-sqlite3
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-libmariadbclient
            mingw-w64-x86_64-postgresql
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-nghttp2
            mingw-w64-x86_64-curl
            mingw-w64-x86_64-libxml2
            mingw-w64-x86_64-icu
            mingw-w64-x86_64-gmp
            mingw-w64-x86_64-libgd
            mingw-w64-x86_64-libsodium
            mingw-w64-x86_64-openldap
            zip
            unzip
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.1

      - name: build
        run: zig build -Doptimize=ReleaseFast

      # the exe links the mingw dlls dynamically; ldd resolves the whole
      # closure, and everything it finds under /mingw64 ships next to the exe
      - name: package
        run: |
          set -euo pipefail
          dir=zphp-windows-x86_64
          mkdir -p "$dir"
          cp zig-out/bin/zphp.exe "$dir/zphp.exe"
          ldd zig-out/bin/zphp.exe | awk '/=> \/mingw64\//{print $3}' | sort -u | while read -r dll; do
            cp "$dll" "$dir/"
          done
          ls "$dir"

      # PATH without /mingw64/bin: only the bundled dlls can satisfy the exe
      - name: smoke test packaged binary
        run: |
          set -euo pipefail
          unset OPENSSL_CONF
          export PATH=$(echo "$PATH" | tr ':' '\n' | grep -v '/mingw64/bin' | paste -sd:)
          ./zphp-windows-x86_64/zphp.exe version
          ./zphp-windows-x86_64/zphp.exe run .github/scripts/release_smoke.php

      - name: record linked libraries
        run: |
          {
            echo "zphp-windows-x86_64 built on windows-latest with zig 0.15.1 and msys2 mingw-w64"
            echo
            ldd zig-out/bin/zphp.exe
            echo
            pacman -Q | grep -E '^mingw-w64-x86_64-(gcc-libs|libwinpthread|pcre2|sqlite3|zlib|libmariadbclient|postgresql|openssl|nghttp2|curl|libxml2|icu|gmp|libgd|libsodium|openldap|libpng|libjpeg|freetype|libtiff|libwebp|libiconv|gettext|xz|zstd|brotli|libpsl|libidn2|libunistring|libssh2|c-ares|bzip2|libavif|libheif|libimagequant|libxpm|expat|readline|termcap|libtasn1|p11-kit|ca-certificates|libffi|libsystre|libtre|cyrus-sasl|krb5|libwebp|libdeflate|jbigkit|lerc|zlib)' || true
          } > zphp-windows-x86_64.libs.txt
          cat zphp-windows-x86_64.libs.txt

      - name: zip
        run: zip -r zphp-windows-x86_64.zip zphp-windows-x86_64

      # the zip is what ships: unpack it somewhere else and run those bytes
      - name: execute packaged zip
        run: |
          set -euo pipefail
          unset OPENSSL_CONF
          export PATH=$(echo "$PATH" | tr ':' '\n' | grep -v '/mingw64/bin' | paste -sd:)
          rm -rf /tmp/zphp-zip && mkdir -p /tmp/zphp-zip
          unzip -q zphp-windows-x86_64.zip -d /tmp/zphp-zip
          /tmp/zphp-zip/zphp-windows-x86_64/zphp.exe version
          /tmp/zphp-zip/zphp-windows-x86_64/zphp.exe run .github/scripts/release_smoke.php

      - uses: actions/attest-build-provenance@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          subject-path: zphp-windows-x86_64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: zphp-windows-x86_64
          path: |
            zphp-windows-x86_64.zip
            zphp-windows-x86_64.libs.txt

  release:
    needs: [build, windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: checksums
        run: |
          cd artifacts
          sha256sum zphp-* | grep -v '\.libs\.txt' > SHA256SUMS
          cat SHA256SUMS
      # the glibc x86_64 artifact runs on this runner: one last execution of
      # exactly the bytes about to be published. the musl artifacts need the
      # musl loader and were executed inside alpine in their build job
      - name: execute published binary
        run: |
          cd artifacts
          chmod +x zphp-linux-x86_64 zphp-linux-x86_64-musl
          ./zphp-linux-x86_64-musl version
          ./zphp-linux-x86_64 version
      - name: create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
