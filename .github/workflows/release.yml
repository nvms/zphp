name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux-x86_64
          - os: ubuntu-24.04-arm
            name: linux-aarch64
          # pinned to 15: macos-latest = macOS 26 whose SDK zig 0.15.1 can't link
          - os: macos-15
            name: macos-aarch64
          - os: ubuntu-24.04
            name: linux-x86_64-musl
            alpine: x86_64
            apk_sha: 34bb1a96f0258982377a289392d4ea9f3f4b767a4bb5806b1b87179b79ad8a1c
          - os: ubuntu-24.04-arm
            name: linux-aarch64-musl
            alpine: aarch64
            apk_sha: e471d35aa221d031abe9b6288aede12a8e9f1a398954e5a2e1d1bce1727b4ef4
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: mlugg/setup-zig@v2
        if: ${{ !matrix.alpine }}
        with:
          version: 0.15.1

      - name: install system libs (ubuntu glibc)
        if: runner.os == 'Linux' && !matrix.alpine
        run: sudo apt-get update && sudo apt-get install -y libpcre2-dev libsqlite3-dev zlib1g-dev libmysqlclient-dev libpq-dev libssl-dev libnghttp2-dev libcurl4-openssl-dev libxml2-dev libicu-dev libgmp-dev libgd-dev libsodium-dev libldap2-dev

      - name: install system libs (macos)
        if: runner.os == 'macOS'
        run: brew install mysql-client libpq openssl@3 nghttp2 curl libxml2 icu4c gmp gd libsodium openldap

      - name: setup alpine (musl)
        if: matrix.alpine
        uses: jirutka/setup-alpine@v1
        with:
          arch: ${{ matrix.alpine }}
          # pinned: a new alpine release changes library packaging under our feet
          branch: v3.22
          apk-tools-url: https://gitlab.alpinelinux.org/api/v4/projects/5/packages/generic/v2.14.10/${{ matrix.alpine }}/apk.static#!sha256!${{ matrix.apk_sha }}
          packages: >
            build-base linux-headers curl xz
            pcre2-dev sqlite-dev sqlite-static zlib-dev zlib-static
            mariadb-connector-c-dev mariadb-static libpq-dev
            openssl-dev openssl-libs-static
            nghttp2-dev nghttp2-static curl-dev curl-static
            libxml2-dev libxml2-static
            icu-dev icu-static icu-libs
            gmp-dev
            gd-dev
            libsodium-dev libsodium-static
            openldap-dev

      - name: install zig (alpine)
        if: matrix.alpine
        shell: alpine.sh --root {0}
        run: |
          cd /tmp
          curl -sSL https://ziglang.org/download/0.15.1/zig-${{ matrix.alpine }}-linux-0.15.1.tar.xz | tar -xJ
          mv zig-${{ matrix.alpine }}-linux-0.15.1 /opt/zig
          ln -s /opt/zig/zig /usr/local/bin/zig
          zig version

      - name: build (glibc/macos)
        if: ${{ !matrix.alpine }}
        run: zig build -Doptimize=ReleaseFast
        env:
          PKG_CONFIG_PATH: ${{ runner.os == 'macOS' && '/opt/homebrew/opt/mysql-client/lib/pkgconfig:/opt/homebrew/opt/libpq/lib/pkgconfig:/opt/homebrew/opt/curl/lib/pkgconfig:/opt/homebrew/opt/icu4c/lib/pkgconfig:/opt/homebrew/opt/gmp/lib/pkgconfig:/opt/homebrew/opt/gd/lib/pkgconfig:/opt/homebrew/opt/libsodium/lib/pkgconfig:/opt/homebrew/opt/openldap/lib/pkgconfig:/usr/local/opt/mysql-client/lib/pkgconfig:/usr/local/opt/libpq/lib/pkgconfig:/usr/local/opt/icu4c/lib/pkgconfig:/usr/local/opt/gmp/lib/pkgconfig:/usr/local/opt/gd/lib/pkgconfig:/usr/local/opt/libsodium/lib/pkgconfig:/usr/local/opt/openldap/lib/pkgconfig' || '' }}

      - name: build (musl)
        if: matrix.alpine
        shell: alpine.sh {0}
        run: zig build -Doptimize=ReleaseFast -Dcpu=baseline

      - name: smoke test (musl)
        if: matrix.alpine
        shell: alpine.sh {0}
        run: |
          cat > /tmp/smoke.php <<'PHP'
          <?php
          echo "musl ok: " . PHP_VERSION . "\n";
          echo (preg_match('/^ok$/', 'ok') ? 'pcre ok' : 'pcre fail') . "\n";
          echo (fileperms('/etc/hostname') > 0 ? 'stat ok' : 'stat fail') . "\n";
          PHP
          ./zig-out/bin/zphp run /tmp/smoke.php

      - name: package
        run: |
          cp zig-out/bin/zphp zphp-${{ matrix.name }}
          chmod +x zphp-${{ matrix.name }}

      # the packaged file is what ships, so that is what gets executed here,
      # not the zig-out build it was copied from
      - name: smoke test packaged binary (glibc/macos)
        if: ${{ !matrix.alpine }}
        run: |
          ./zphp-${{ matrix.name }} version
          ./zphp-${{ matrix.name }} run .github/scripts/release_smoke.php

      - name: smoke test packaged binary (musl)
        if: matrix.alpine
        shell: alpine.sh {0}
        run: |
          ./zphp-${{ matrix.name }} version
          ./zphp-${{ matrix.name }} run .github/scripts/release_smoke.php

      # which native libraries the binary loads at runtime, with the versions
      # the build host had. glibc and macos builds link them dynamically and
      # need the same sonames on the target machine; musl builds are static
      - name: record linked libraries
        run: |
          {
            echo "zphp-${{ matrix.name }} built on ${{ matrix.os }} with zig 0.15.1"
            echo
            if [ "${{ runner.os }}" = "macOS" ]; then
              otool -L zphp-${{ matrix.name }}
              echo
              brew list --versions mysql-client libpq openssl@3 nghttp2 curl libxml2 icu4c gmp gd libsodium openldap pcre2 sqlite 2>/dev/null || true
            elif [ -n "${{ matrix.alpine }}" ]; then
              echo "static musl build (no runtime library dependencies beyond the kernel)"
              file zphp-${{ matrix.name }} || true
            else
              ldd zphp-${{ matrix.name }}
              echo
              dpkg-query -W libpcre2-8-0 libsqlite3-0 zlib1g libmysqlclient21 libpq5 libssl3t64 libnghttp2-14 libcurl4t64 libxml2 libicu74 libgmp10 libgd3 libsodium23 libldap2 2>/dev/null || dpkg-query -W 'libpcre2*' 'libsqlite3*' 'zlib1g' 'libmysqlclient*' 'libpq5' 'libssl3*' 'libnghttp2*' 'libcurl4*' 'libxml2' 'libicu*' 'libgmp10' 'libgd3' 'libsodium*' 'libldap*' 2>/dev/null || true
            fi
          } > zphp-${{ matrix.name }}.libs.txt
          cat zphp-${{ matrix.name }}.libs.txt

      - uses: actions/attest-build-provenance@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          subject-path: zphp-${{ matrix.name }}

      - uses: actions/upload-artifact@v4
        with:
          name: zphp-${{ matrix.name }}
          path: |
            zphp-${{ matrix.name }}
            zphp-${{ matrix.name }}.libs.txt

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: checksums
        run: |
          cd artifacts
          sha256sum zphp-* | grep -v '\.libs\.txt' > SHA256SUMS
          cat SHA256SUMS
      # the x86_64 artifacts run on this runner: one last execution of exactly
      # the bytes that are about to be published
      - name: execute published binaries
        run: |
          cd artifacts
          chmod +x zphp-linux-x86_64 zphp-linux-x86_64-musl
          ./zphp-linux-x86_64-musl version
          ./zphp-linux-x86_64 version
      - name: create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
